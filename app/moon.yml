language: javascript
tasks:
    dev:
        command: astro dev
    build:
        script: astro check && astro build
        deps:
            - webllm-otel:build
        # Declaring the output is what lets moon restore `dist/` on a cache hit.
        # Without it a cached run is a no-op that leaves no build output at all,
        # so anything reading `dist/` afterwards — `assert-no-dev-code`,
        # `astro preview`, the deploy step — sees a missing or stale directory.
        outputs:
            - 'dist'
    preview:
        command: astro preview
    test:
        command: vitest run
        deps:
            - webllm-otel:build
    test-coverage:
        command: vitest run --coverage
        deps:
            - webllm-otel:build
    test-watch:
        command: vitest
    lint-fix:
        command: eslint "src/**/*.{astro,ts,tsx}" --fix
    lint:
        command: eslint "src/**/*.{astro,ts,tsx}"
    lint-deadcode:
        command: knip
    lint-deps:
        command: depcruise src
    lint-fix-sql:
        script: uvx sqruff@0.37.3 fix
        toolchain: unstable_uv
    lint-sql:
        script: uvx sqruff@0.37.3 lint
        toolchain: unstable_uv
    format:
        command: prettier --write .
    format-check:
        command: prettier --check .
    audit:
        command: pnpm audit --prod
    typecheck:
        command: tsc --noEmit
    pnpm:
        command: pnpm
layer: application
